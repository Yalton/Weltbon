# CI on Forgejo (repo.billbert.co), the canonical repository.
#
# Forgejo reads .forgejo/workflows and ignores .github/workflows whenever this
# directory exists. The .github workflows run only on the public GitHub mirror.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      HOME: /tmp
      PNPM_HOME: /tmp/pnpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: cd api && pnpm test -- --maxWorkers=1
      - run: cd web && pnpm exec vitest run

  integration-smoke:
    runs-on: ubuntu-latest
    env:
      HOME: /tmp
      PNPM_HOME: /tmp/pnpm
      # Job and service containers share a network; the service is reached by name.
      DATABASE_URL: postgresql://weltbon:weltbon@postgres:5432/weltbon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weltbon
          POSTGRES_USER: weltbon
          POSTGRES_PASSWORD: weltbon
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U weltbon -d weltbon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: cd api && pnpm db:migrate
      - run: cd api && pnpm test:integration:smoke
      # EXP-03 (tests/export-pdf.test.ts) drives a system Chromium through
      # puppeteer-core and skips itself unless CHROMIUM_PATH is set, so it
      # never ran here. Install Debian's chromium and run it, and fail the job
      # unless all three tests pass: a skip must not count as green.
      - name: Install Chromium
        run: |
          apt-get update -o Acquire::Retries=3
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chromium
      - name: PDF export tests (EXP-03)
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/chromium
          NO_COLOR: '1'
        run: |
          set -o pipefail
          cd api
          npx vitest run --project integration tests/export-pdf.test.ts 2>&1 | tee /tmp/export-pdf.log
          grep -Eq 'Tests +3 passed \(3\)' /tmp/export-pdf.log || { echo 'export-pdf.test.ts did not report 3 passed tests' >&2; exit 1; }
