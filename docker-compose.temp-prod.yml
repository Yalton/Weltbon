# Temp-prod override — a disposable "production" instance on this machine, used
# as a sync TARGET while the desktop app does not exist yet.
#
# Usage (always pass BOTH files, in this order):
#   docker compose -f docker-compose.yml -f docker-compose.temp-prod.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.temp-prod.yml down -v
#
# Why this file exists rather than editing docker-compose.yml: that file is the
# real production stack and should stay untouched. Everything here is a local
# testing concession, and passing `-f` explicitly means none of it can leak into
# a real deploy the way an auto-loaded docker-compose.override.yml would.
#
# The `!override` tag is required on `ports`. Compose merges port lists by
# APPENDING, so without it the base file's "3000:3000" (which binds 0.0.0.0)
# survives alongside the line below and the stack fails to start with a port
# collision — two publishers for the same host port.
services:
  app:
    # Bind loopback only. The base file publishes 0.0.0.0:3000, which would put
    # an instance holding a plaintext invite code on the LAN.
    ports: !override
      - "127.0.0.1:3000:3000"
