# Build and publish the Weltbon container image to GHCR.
#
# Trigger: any pushed git tag matching `v*` (e.g., v2.1, v2.1.1, v3.0).
#
# Published tags for a push of tag `vX.Y.Z`:
#   - ghcr.io/<owner>/weltbon:X.Y.Z
#   - ghcr.io/<owner>/weltbon:X.Y
#   - ghcr.io/<owner>/weltbon:latest
#   - ghcr.io/<owner>/weltbon:sha-<short-commit>
#
# One-time repo setup required:
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write"
#
# Verify a publish: visit https://ghcr.io/<owner>/weltbon after a v* push.
# Replace <owner> with this repo's GitHub owner (user or org) at first use.

name: publish-ghcr

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weltbon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity for GET /api/version. `{{version}}` here is the same
          # value metadata-action derived for the image tag, so the version the
          # running app reports and the tag it was pulled as cannot disagree.
          build-args: |
            WELTBON_VERSION=${{ steps.meta.outputs.version }}
            WELTBON_COMMIT=${{ github.sha }}
            WELTBON_BUILT_AT=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
