# Build and publish the Weltbon container image to GHCR.
#
# Trigger: any pushed git tag matching `v*` (e.g., v2.1, v2.1.1, v3.0).
#
# Published tags for a push of tag `vX.Y.Z`:
#   - ghcr.io/<owner>/weltbon:X.Y.Z
#   - ghcr.io/<owner>/weltbon:X.Y
#   - ghcr.io/<owner>/weltbon:latest
#   - ghcr.io/<owner>/weltbon:sha-<short-commit>
#
# One-time repo setup required:
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write"
#
# Verify a publish: visit https://ghcr.io/<owner>/weltbon after a v* push.
# Replace <owner> with this repo's GitHub owner (user or org) at first use.

name: publish-ghcr

on:
  push:
    tags:
      # Three-part semver ONLY, matching publish-desktop.yml.
      #
      # `v*` also matched this repo's milestone-archive tags — v1.0 through
      # v5.3, cut by commits like `chore: archive v5.3 milestone files`. Those
      # are project-phase markers from a numbering scheme unrelated to the app
      # version, and this workflow has been building and pushing images for them
      # all along: the runs for v5.0, v5.1 and v5.2 are milestone archives, not
      # releases, and metadata-action tagged each one as `latest`.
      #
      # Release tags are cut by release.yml and are always three-part. A
      # milestone tag must never move `latest` on a published image again.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Self-hosted, NOT ubuntu-latest — see the same note in release.yml. The
    # org billing block stops GitHub-hosted runners from starting at all, so a
    # tag would otherwise ship nothing.
    #
    # This job DOES build and push an image, which makes it heavier than the
    # release job in three ways worth knowing before touching it:
    #
    #   - It builds on the box that also runs production. Disk is the real
    #     constraint (~19 GB free when this was written, against a ~20 GB image
    #     store); a `docker system prune` may become part of routine care here.
    #   - buildx and the Docker socket come from the runner container's mounted
    #     /var/run/docker.sock, so builds land in the HOST daemon and outlive
    #     the job.
    #   - It authenticates to GHCR with GITHUB_TOKEN, which is fine on a
    #     self-hosted runner only because this repository is private. A
    #     self-hosted runner on a public repo executes any fork's pull-request
    #     code; making this repo public without moving these jobs back to
    #     hosted runners would hand that code the Docker socket.
    runs-on: [self-hosted, citreum]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/weltbon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity for GET /api/version. `{{version}}` here is the same
          # value metadata-action derived for the image tag, so the version the
          # running app reports and the tag it was pulled as cannot disagree.
          build-args: |
            WELTBON_VERSION=${{ steps.meta.outputs.version }}
            WELTBON_COMMIT=${{ github.sha }}
            WELTBON_BUILT_AT=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
