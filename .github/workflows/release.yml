# Mirror a finished Forgejo release onto GitHub.
#
# Weltbon is built on Forgejo (repo.billbert.co), not here. Forgejo's release
# workflow pushes a tag to this repository only after its own release is
# published with every desktop package attached. This workflow then copies
# those files onto a GitHub release, and copies the container image from the
# Forgejo registry to GHCR when one was built. Nothing is compiled here.
#
# Secret: FORGEJO_TOKEN, a Forgejo access token for user yalt with the
# read:repository and read:package scopes. It reads the private release, its
# files (from the weltbon-desktop generic package) and the container image.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write

env:
  FORGEJO_API: https://repo.billbert.co/api/v1/repos/yalt/Weltbon
  FORGEJO_IMAGE: repo.billbert.co/yalt/weltbon
  FORGEJO_PACKAGES: https://repo.billbert.co/api/packages/yalt/generic/weltbon-desktop

jobs:
  mirror:
    if: github.repository == 'Yalton/Weltbon'
    runs-on: ubuntu-latest
    steps:
      - name: Download the release files from Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Forgejo's publish job pushes the tag here only after its release is
          # published, so a draft or missing release means something is wrong.
          curl --fail --silent --show-error --header "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API}/releases/tags/${TAG}" > release.json
          jq -e '.draft == false' release.json > /dev/null
          # Release attachments of a private Forgejo repository are served only
          # to browser sessions, so the files come from the generic package the
          # Forgejo build uploads alongside them.
          version="${TAG#v}"
          mkdir assets
          jq -r '.assets[].name' release.json | while IFS= read -r name; do
            echo "downloading ${name}"
            curl --fail --silent --show-error --user "yalt:${FORGEJO_TOKEN}" \
              --output "assets/${name}" \
              "${FORGEJO_PACKAGES}/${version}/$(jq -rn --arg n "$name" '$n|@uri')"
          done
          test "$(ls assets | wc -l)" -eq "$(jq '.assets | length' release.json)"
          ls -l assets

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* -R "$GITHUB_REPOSITORY" \
              --title "Weltbon ${TAG}" --generate-notes --verify-tag "${prerelease[@]}"
          fi

      - name: Copy the container image to GHCR
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src="docker://${FORGEJO_IMAGE}:${version}"
          src_creds="yalt:${FORGEJO_TOKEN}"
          if ! skopeo inspect --creds "$src_creds" "$src" > /dev/null 2>&1; then
            echo "No image ${FORGEJO_IMAGE}:${version} on Forgejo; this release ships without one."
            exit 0
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          dest="ghcr.io/${owner}/weltbon"
          tags=("$version")
          [[ "$version" != *-* ]] && tags+=("${version%.*}" latest)
          for t in "${tags[@]}"; do
            skopeo copy --all --src-creds "$src_creds" \
              --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              "$src" "docker://${dest}:${t}"
          done
