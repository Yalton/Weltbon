# Full database-gated integration coverage, run once per day.
name: nightly-integration

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  integration:
    name: integration-nightly
    runs-on: [self-hosted, weltbon-ci-integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weltbon
          POSTGRES_USER: weltbon
          POSTGRES_PASSWORD: weltbon
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U weltbon -d weltbon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://weltbon:weltbon@localhost:${{ job.services.postgres.ports[5432] }}/weltbon
        run: cd api && pnpm db:migrate

      - name: Run nightly integration tests
        env:
          DATABASE_URL: postgresql://weltbon:weltbon@localhost:${{ job.services.postgres.ports[5432] }}/weltbon
        run: cd api && pnpm test:integration:nightly
