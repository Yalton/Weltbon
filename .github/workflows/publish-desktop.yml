# Build the Weltbon desktop app and attach the artifacts to a GitHub Release.
#
# Trigger: any pushed git tag matching `v*` — the same trigger as
# publish-ghcr.yml, so one tag ships both the container image and the desktop
# build. The two workflows are deliberately INDEPENDENT: a desktop failure must
# not stop the server image from shipping, and vice versa.
#
# One-time repo setup (same as publish-ghcr.yml):
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write"
#
# WHY THE SPLIT. This repo is private, so runner minutes are billed at 1x for
# Linux, 2x for Windows and 10x for macOS.
#
#   release       — Linux AND Windows, on a v* tag. Both attach to the Release.
#   experimental  — macOS only, MANUAL (workflow_dispatch). 10x billing for a
#                   platform nobody has built here is not worth spending on
#                   every tag.
#
# Windows was promoted into `release` after v0.2.1, whose .exe had to be
# produced by a manual dispatch against the tag. That step is exactly the kind
# of thing that gets forgotten, and forgetting it leaves Windows users on a
# stale version with no signal that anything is missing.
#
# Windows is STILL UNVERIFIED in the sense that matters: a green build proves an
# artifact was produced, not that it launches. The whole point of issue #7 was a
# crash that only appeared when the packaged app was actually run. `fail-fast:
# false` keeps a Windows failure from taking the Linux release down with it.
#
name: publish-desktop

on:
  push:
    tags:
      # Three-part semver ONLY. `v*` also matched this repo's milestone-archive
      # tags (v1.0 ... v5.3, `chore: archive v5.3 milestone files`), which are a
      # different numbering scheme entirely — the next milestone tag would have
      # fired a desktop release build. Release tags are cut by release.yml.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      # Linux and Windows now build on every tag, and a dispatch builds both
      # into a draft prerelease, so neither needs an opt-in any more. macOS is
      # the only target still costing 10x for an artifact nobody has opened.
      experimental_macos:
        description: 'Also build the unverified macOS target (billed at 10x)'
        type: boolean
        default: false

# ── STILL ON GITHUB-HOSTED RUNNERS, AND CURRENTLY BLOCKED ───────────────────
# release.yml and publish-ghcr.yml moved to the self-hosted citreum runner on
# 2026-08-30, because the org billing block stops GitHub-hosted runners from
# starting at all. This workflow did NOT move, and the reason is structural
# rather than a decision left half-made: the Windows and macOS targets need
# Windows and macOS runners, which the self-hosted Linux box cannot provide.
#
# The Linux target could technically move, but electron-builder's AppImage and
# .deb outputs need packaging tools (fpm, fuse, dpkg-deb) the runner image does
# not carry, so moving it would trade a blocked build for a broken one.
#
# Consequence while the billing block lasts: a tag ships the container image and
# NO desktop artifacts. That is a real gap, not a quiet one — the release job's
# verify step only checks publish-ghcr, so nothing else will tell you.

permissions:
  contents: write   # required to upload assets onto the Release (both jobs)

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure must NOT cancel the Linux build. Linux is the verified
      # platform and the one that has to ship no matter what.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            builder_flag: '--linux'
            # Space-separated globs, expanded by bash in the delivery steps.
            globs: 'desktop/release/*.AppImage desktop/release/*.deb'
            # Newline-separated, which is what upload-artifact's `path` wants.
            artifact_path: |
              desktop/release/*.AppImage
              desktop/release/*.deb
          # windows-2022 pinned deliberately: Electron's bundled node-gyp does
          # not recognize the Visual Studio 2026 image behind windows-latest.
          - name: windows
            os: windows-2022
            builder_flag: '--win'
            globs: 'desktop/release/*.exe'
            artifact_path: 'desktop/release/*.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `shell: bash` on EVERY run step from here down. The Windows runner
      # defaults to PowerShell, where `set -euo pipefail`, `shopt` and the array
      # syntax below are all syntax errors rather than no-ops.
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # Builds web + api, bundles the API into desktop/.stage/api, copies the
      # migrations and the built SPA, and rebuilds bcrypt/sharp for Electron's
      # ABI in that staged tree. electron-builder ships it as extraResources.
      #
      # WELTBON_VERSION comes from the tag on a release build. On a manual
      # dispatch there is no tag, and stage-api.sh falls back to package.json —
      # which is the RELEASED version, not this build. Stamping `-dev.<sha>`
      # keeps a dispatch artifact from being mistaken for the release it follows.
      - name: Stage the API for packaging
        shell: bash
        env:
          WELTBON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "${WELTBON_VERSION}" ]; then
            export WELTBON_VERSION="${WELTBON_VERSION#v}"
          else
            base=$(node -p "require('./package.json').version")
            export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          echo "staging version ${WELTBON_VERSION} (${WELTBON_COMMIT})"
          cd desktop && pnpm run build && pnpm run stage

      # extraMetadata.version overrides desktop/package.json for THIS build only,
      # so the artifact filename matches what the app reports at runtime. Before
      # this existed every artifact ever produced was named 0.1.0.
      - name: Build the desktop package
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop && ./node_modules/.bin/electron-builder ${{ matrix.builder_flag }} \
            --config electron-builder.yml --config.extraMetadata.version="$ver"

      # ── ORDER MATTERS ────────────────────────────────────────────────────────
      # Delivery runs BEFORE the artifact upload. It used to run after, and on
      # the v0.2.0 build that cost the release outright: the packages built fine,
      # the artifact upload hit `Artifact storage quota has been hit`, the job
      # failed, and "Attach to the GitHub Release" was SKIPPED. A finished
      # AppImage and deb were discarded because a convenience copy could not be
      # stored. Release assets and Actions artifacts are separate quotas.
      #
      # `gh` rather than a third-party release action: this needs
      # `contents: write`, and the release path is where a supply-chain
      # compromise would ship to every self-hoster. `--clobber` makes a re-run of
      # the same tag idempotent instead of failing on an existing asset.
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GLOBS: ${{ matrix.globs }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=($GLOBS)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages matched $GLOBS — the build step should have failed first." >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # A manual dispatch has no tag and therefore no Release to attach to, so a
      # draft prerelease is its delivery channel. Draft: no git tag is created
      # and it stays invisible outside collaborators. Delete it once collected.
      - name: Publish a draft prerelease (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-dev-${{ github.run_id }}
          GLOBS: ${{ matrix.globs }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=($GLOBS)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages matched $GLOBS — the build step should have failed first." >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --prerelease \
                 --title "desktop dev build ${{ github.run_id }}" \
                 --notes "Unverified desktop build from ${{ github.sha }}. Draft: delete after collection."
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # Best-effort convenience copy, AFTER delivery already happened. This
      # repo's Actions artifact quota reports itself full even with 0 MB of live
      # artifacts, so this step must never be able to fail the job.
      - name: Upload build artifacts (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weltbon-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 14

  experimental:
    name: macos (unverified)
    # Manual only, and opt-in even then. Never runs on a tag: macOS is billed at
    # 10x and has never been built here, so every tag paying for it would buy an
    # artifact nobody has opened.
    if: github.event_name == 'workflow_dispatch' && inputs.experimental_macos
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Stage the API for packaging
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version")
          export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          echo "staging version ${WELTBON_VERSION} (${WELTBON_COMMIT})"
          cd desktop && pnpm run build && pnpm run stage

      - name: Build the desktop package
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop && ./node_modules/.bin/electron-builder --mac \
            --config electron-builder.yml --config.extraMetadata.version="$ver"

      - name: Publish to a draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-dev-${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .dmg produced — the build step should have failed first." >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --prerelease \
                 --title "desktop dev build ${{ github.run_id }}" \
                 --notes "Unverified macos desktop build from ${{ github.sha }}. Draft: delete after collection."
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Upload build artifacts (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weltbon-desktop-macos
          path: desktop/release/*.dmg
          if-no-files-found: warn
          retention-days: 14
