# Build the Weltbon desktop app and attach the artifacts to a GitHub Release.
#
# Trigger: any pushed git tag matching `v*` — the same trigger as
# publish-ghcr.yml, so one tag ships both the container image and the desktop
# build. The two workflows are deliberately INDEPENDENT: a desktop failure must
# not stop the server image from shipping, and vice versa.
#
# One-time repo setup (same as publish-ghcr.yml):
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write"
#
# WHY TWO JOBS RATHER THAN ONE MATRIX. This repo is private, so runner minutes
# are billed at 1x for Linux, 2x for Windows and 10x for macOS. Linux is the
# only platform that has been built AND run (issue #7); Windows (#8) and macOS
# (#9) have never been built here at all. Putting all three on the tag trigger
# would spend roughly 240 extra billed minutes per release producing artifacts
# nobody has verified. So:
#
#   release       — Linux only, on a v* tag. Cheap, and it is what ships.
#   experimental  — Windows + macOS, MANUAL ONLY (workflow_dispatch). Run it
#                   while working #8/#9 to get real build logs, without making
#                   every release pay for them.
#
# Promote a platform into `release` only once someone has installed and run the
# artifact on that OS. A green build proves an artifact was produced, not that
# it works — the whole point of #7 was discovering a crash that only appeared
# when the packaged app was actually launched.
name: publish-desktop

on:
  push:
    tags:
      # Three-part semver ONLY. `v*` also matched this repo's milestone-archive
      # tags (v1.0 ... v5.3, `chore: archive v5.3 milestone files`), which are a
      # different numbering scheme entirely — the next milestone tag would have
      # fired a desktop release build. Release tags are cut by release.yml.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      experimental:
        description: 'Also build the unverified Windows/macOS targets (billed at 2x/10x)'
        type: boolean
        default: false
      # Windows is billed at 2x and macOS at 10x, so "I need a Windows build"
      # should not have to buy a macOS one. The old boolean could only run the
      # pair. `both` is the default so an existing dispatch that just ticks
      # `experimental` behaves exactly as it did before.
      experimental_targets:
        description: 'Which experimental targets to build (only applies when experimental is checked)'
        type: choice
        default: both
        options:
          - both
          - windows
          - macos

permissions:
  contents: write   # required to upload assets onto the Release (both jobs)

jobs:
  release:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds web + api, runs `pnpm deploy --prod` into desktop/.stage/api, copies
      # the migrations and the built SPA, and rebuilds bcrypt/sharp for Electron's
      # ABI in that staged tree. electron-builder ships it as extraResources.
      # WELTBON_VERSION comes from the tag on a release build. On a manual
      # dispatch there is no tag, and stage-api.sh falls back to package.json —
      # which is the RELEASED version, not this build. Stamping `-dev.<sha>`
      # keeps a dispatch artifact from being mistaken for the release it follows.
      - name: Stage the API for packaging
        env:
          WELTBON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          WELTBON_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${WELTBON_VERSION}" ]; then
            export WELTBON_VERSION="${WELTBON_VERSION#v}"
          else
            base=$(node -p "require('./package.json').version")
            export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          echo "staging version ${WELTBON_VERSION} (${WELTBON_COMMIT})"
          cd desktop && pnpm run build && pnpm run stage

      # extraMetadata.version overrides desktop/package.json for THIS build only,
      # so the artifact filename matches what the app reports at runtime.
      - name: Build the desktop package
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop && ./node_modules/.bin/electron-builder --linux \
            --config electron-builder.yml --config.extraMetadata.version="$ver"

      # ── ORDER MATTERS ────────────────────────────────────────────────────
      # The Release attach runs BEFORE the artifact upload. It used to run after,
      # and on the v0.2.0 build that cost us the release: the packages built
      # fine, the artifact upload hit `Artifact storage quota has been hit`, the
      # job failed, and "Attach to the GitHub Release" was SKIPPED. A finished
      # AppImage and deb were thrown away because a convenience copy could not
      # be stored.
      #
      # Release assets and Actions artifacts are separate quotas. On a tag the
      # Release is the deliverable; the artifact is a nicety, so it must not be
      # able to fail the job.

      # Uses the preinstalled `gh` rather than a third-party release action: this
      # needs `contents: write`, and every other workflow here sticks to
      # first-party actions. Not worth granting write to another supply-chain
      # dependency for an upload. `--clobber` makes a re-run of the same tag
      # idempotent instead of failing on an asset that already exists.
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          shopt -s nullglob
          files=(desktop/release/*.AppImage desktop/release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found — the build step should have failed before here." >&2
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # A manual dispatch has no tag and therefore no Release to attach to, so a
      # draft prerelease is its delivery channel. Draft: no git tag is created
      # and it stays invisible outside collaborators. Delete it once collected.
      - name: Publish a draft prerelease (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-dev-${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/release/*.AppImage desktop/release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages found — the build step should have failed before here." >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --prerelease \
                 --title "desktop dev build ${{ github.run_id }}" \
                 --notes "Unverified linux desktop build from ${{ github.sha }}. Draft: delete after collection."
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # Best-effort convenience copy, AFTER delivery has already happened. This
      # repo's Actions artifact quota reports itself full even with 0 MB of live
      # artifacts, so this step must never be able to fail the job.
      - name: Upload build artifacts (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weltbon-desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: warn
          retention-days: 14

  experimental:
    name: ${{ matrix.name }} (unverified)
    # Manual only, and opt-in even then. Never runs on a tag.
    if: github.event_name == 'workflow_dispatch' && inputs.experimental
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      # One platform failing must not cancel the other — the point is logs.
      fail-fast: false
      # `include` has to be a literal or a fromJSON() of one — there is no way to
      # drop a matrix entry from an input, and a step-level `if` would not help
      # because the runner is already billed by the time a step is evaluated.
      # Hence the inlined JSON. Windows pins VS 2022: Electron's bundled node-gyp
      # does not yet recognize the Visual Studio 2026 image behind windows-latest.
      # The `|| 'both'` fallback keeps this valid if the job is ever reached from
      # a trigger that defines no inputs.
      matrix:
        include: ${{ fromJSON((inputs.experimental_targets || 'both') == 'windows' && '[{"name":"windows","os":"windows-2022","builder_flag":"--win","glob":"desktop/release/*.exe"}]' || (inputs.experimental_targets || 'both') == 'macos' && '[{"name":"macos","os":"macos-latest","builder_flag":"--mac","glob":"desktop/release/*.dmg"}]' || '[{"name":"windows","os":"windows-2022","builder_flag":"--win","glob":"desktop/release/*.exe"},{"name":"macos","os":"macos-latest","builder_flag":"--mac","glob":"desktop/release/*.dmg"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `shell: bash` matters on the Windows runner — stage-api.sh is a bash
      # script, and the default shell there is PowerShell. Note the staging
      # script's `pnpm deploy` produces symlinks into a bundled .pnpm/ rather
      # than a flat tree; that survived packaging on Linux but is exactly the
      # kind of thing to check in these logs for #8.
      - name: Stage the API for packaging
        shell: bash
        env:
          WELTBON_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "${WELTBON_VERSION}" ]; then
            export WELTBON_VERSION="${WELTBON_VERSION#v}"
          else
            base=$(node -p "require('./package.json').version")
            export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          echo "staging version ${WELTBON_VERSION} (${WELTBON_COMMIT})"
          cd desktop && pnpm run build && pnpm run stage

      - name: Build the desktop package
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop && ./node_modules/.bin/electron-builder ${{ matrix.builder_flag }} \
            --config electron-builder.yml --config.extraMetadata.version="$ver"

      # Same reasoning as the linux job: Release assets are a separate quota from
      # Actions artifacts, and the artifact upload has failed builds that were
      # otherwise green (runs 32676922819 and 32677959012, both Windows).
      - name: Publish the build to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('desktop-dev-{0}', github.run_id) }}
          GLOB: ${{ matrix.glob }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=($GLOB)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages matched $GLOB — the build step should have failed first." >&2
            exit 1
          fi
          if [ "$IS_TAG" = "true" ]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          else
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --draft --prerelease \
                   --title "desktop dev build ${{ github.run_id }}" \
                   --notes "Unverified ${{ matrix.name }} desktop build from ${{ github.sha }}. Draft: delete after collection."
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Upload build artifacts (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weltbon-desktop-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: warn
          retention-days: 14
