# CI for pull requests on the public GitHub repository.
#
# Releases are built by .github/workflows/release.yml on self-hosted runners;
# this file only tests. It runs on GitHub-hosted runners: a self-hosted runner on a public
# repository would execute code from any fork's pull request.
#
#   - unit: api unit project (no database), web vitest and desktop tests.
#   - integration: postgres:16-alpine service containers; migrations and the
#     smoke tier on every run, then four sharded merge jobs (the database-gated
#     suites registered in api/ci/integration-tiers.mjs) on pushes to master.
#
# GitHub assigns each service container's host port dynamically, so database
# steps read it from `${{ job.services.postgres.ports[5432] }}`. The postgres
# credentials are test-only and scoped to the throwaway service container.

name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --maxWorkers=1 is for the self-hosted runner, not a preference. The
      # db/client tests construct pglite (Postgres compiled to WASM), which
      # costs 1.6-3.3s each even in isolation. Concurrent construction can
      # blow the 10s default timeout. Two workers still intermittently time out
      # on the dedicated CI VM, so this lane stays serial. Capping
      # workers fixes the cause; raising the
      # timeouts would only have hidden it.
      - name: Run api unit tests
        run: cd api && pnpm test -- --maxWorkers=1

      - name: Run web tests
        run: cd web && pnpm exec vitest run

      # Covers desktop/src/secrets.test.ts, which pins the DV-10 data-loss fix
      # (an unreadable/malformed secrets.json must never be silently
      - name: Run desktop tests
        run: cd desktop && pnpm test

  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        # Disposable CI data: cap each memory-backed filesystem at 1 GiB.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weltbon
          POSTGRES_USER: weltbon
          POSTGRES_PASSWORD: weltbon
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U weltbon -d weltbon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://weltbon:weltbon@localhost:${{ job.services.postgres.ports[5432] }}/weltbon
        run: cd api && pnpm db:migrate

      - name: Run api integration smoke tests
        env:
          DATABASE_URL: postgresql://weltbon:weltbon@localhost:${{ job.services.postgres.ports[5432] }}/weltbon
        run: cd api && pnpm test:integration:smoke

  integration-merge:
    name: integration-merge (${{ matrix.shard }})
    if: github.event_name == 'push'
    # An 8-core host cannot reliably run smoke plus four disk-backed database
    # lanes at once. Wait for the PR-equivalent gates, then run two shards at
    # a time so unrelated database setup hooks do not starve each other.
    needs: [unit, integration-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    services:
      postgres:
        # Disposable CI data: cap each memory-backed filesystem at 1 GiB.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weltbon
          POSTGRES_USER: weltbon
          POSTGRES_PASSWORD: weltbon
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U weltbon -d weltbon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://weltbon:weltbon@localhost:${{ job.services.postgres.ports[5432] }}/weltbon
        run: cd api && pnpm db:migrate

      - name: Run api integration merge shard
        env:
          DATABASE_URL: postgresql://weltbon:weltbon@localhost:${{ job.services.postgres.ports[5432] }}/weltbon
        run: cd api && pnpm test:integration:merge ${{ matrix.shard }}
