# Weltbon PR + master CI (Phase 27 PROV-FOLLOWUP-03).
#
# Two lanes per locked Phase 27 decisions:
#   - Lane 1 (unit, ~30 sec):   pnpm test (api unit project, no DB) + web vitest
#     + desktop `node --test` (issue #13). The desktop suite is DB-less and
#     sub-second, and root `pnpm install` already installs its deps, so it
#     rides in this lane rather than adding a job (a new job would need its
#     own install AND a new required-status-check entry under D-16).
#   - Lane 2 (integration, ~3 min): postgres:16-alpine service container; runs
#     drizzle migrations then `pnpm test:integration` (the DB-gated suites
#     registered in api/vitest.config.ts DB_GATED_TESTS, including the 8
#     suites named in Phase 27 SC3).
#
# Triggers per D-15: every pull_request (any base) + every push to master.
# No path filter — see CONTEXT.md <deferred> for rationale.
#
# Branch protection (D-16) is an operator action: GitHub -> Repo Settings ->
# Branches -> master -> Branch protection rules -> Require status checks to
# pass before merging -> mark `ci / unit` AND `ci / integration` as required.
# Documented in the phase SUMMARY.
#
# Runner: `[self-hosted, citreum]` — the `llcbox-citreum` runner registered to
# this repository, not a GitHub-hosted one. GitHub-hosted minutes stopped being
# billable on the org account, and every job failed before checkout with "The
# job was not started because recent account payments have failed"; self-hosted
# minutes are free. The repository is PRIVATE, which is what makes this safe:
# a self-hosted runner on a public repo executes code from any fork's pull
# request. Do not make this repository public without moving CI back to hosted
# runners or gating the workflow on `pull_request_target` review.
#
# The runner is one machine, so the two lanes below run sequentially rather
# than in parallel. It also shares a host with the production deployment, which
# is why the integration lane's postgres service publishes host port 5441 and
# not 5432. 5432 is the port `docker compose up -d db` — the DEV database this
# repo's project documentation tells everyone to start on their box — binds, and the port a
# production compose stack would publish if it ever stopped being
# container-network-only. Sharing it cost both directions at once: a dev DB
# already up made every CI run fail to bind, a CI run in flight blocked that
# container from restarting, and in the worst version DATABASE_URL below would
# have addressed a real database while the suite's per-file schema teardown
# ran. 5441 is claimed by nothing on this host and is one off from the 5440 the
# local integration DB uses, so the two cannot collide either. Change it only
# together with DATABASE_URL below — they are one setting written twice.
#
# Test-only postgres creds (weltbon/weltbon/weltbon) are scoped to the
# ephemeral service container and mirror docker-compose.yml verbatim per D-14.
# Per the phase threat model (T-27-01-01), this workflow MUST NOT reference
# any repository-secret context for provider API keys; cross-AI smoke against
# real provider keys is explicitly out of scope and routed to a future
# hardening phase.

name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: [self-hosted, citreum]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --maxWorkers=2 is for the self-hosted runner, not a preference. The
      # db/client tests construct pglite (Postgres compiled to WASM), which
      # costs 1.6-3.3s each even in isolation. At default parallelism on a
      # four-core box that also runs production, several of those construct at
      # once and blow the 10s default timeout — three consecutive runs failed
      # on three DIFFERENT pglite tests, which is the signature of contention
      # rather than a defect. Capping workers fixes the cause; raising the
      # timeouts would only have hidden it.
      - name: Run api unit tests
        run: cd api && pnpm test -- --maxWorkers=2

      - name: Run web tests
        run: cd web && pnpm exec vitest run

      # Covers desktop/src/secrets.test.ts, which pins the DV-10 data-loss fix
      # (an unreadable/malformed secrets.json must never be silently
      # regenerated over). It ran in no CI lane until issue #13.
      - name: Run desktop tests
        run: cd desktop && pnpm test

  integration:
    name: integration
    runs-on: [self-hosted, citreum]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weltbon
          POSTGRES_USER: weltbon
          POSTGRES_PASSWORD: weltbon
        ports:
          # Host 5441, container 5432. See the header: 5432 on this runner
          # belongs to the dev/production compose stack, not to CI.
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U weltbon -d weltbon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://weltbon:weltbon@localhost:5441/weltbon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: cd api && pnpm db:migrate

      - name: Run api integration tests
        run: cd api && pnpm test:integration
