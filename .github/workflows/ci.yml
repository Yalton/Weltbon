# Two-lane PR / master CI.
#
# Trigger: every pull_request push (any base) + every push to master (D-15).
# No path filter — keep the mental model simple (project documentation PRs cost ~30s for
# the unit lane to produce a green tick).
#
# Lane 1 — unit (~30s): no live DB required.
# Lane 2 — integration (~3min): postgres:16-alpine service container (D-14).
#
# Both lanes must be green to merge to master (D-16 — operator-configured branch
# protection; see GitHub repo → Settings → Branches → master protection rule).

name: ci

on:
  pull_request: {}
  push:
    branches:
      - master

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit tests
        run: pnpm --filter @weltbon/api test

      - name: Run web unit tests
        run: cd web && pnpm exec vitest run

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weltbon
          POSTGRES_PASSWORD: weltbon
          POSTGRES_DB: weltbon
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://weltbon:weltbon@localhost:5432/weltbon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm --filter @weltbon/api db:migrate

      - name: Run API integration tests
        run: pnpm --filter @weltbon/api test:integration
