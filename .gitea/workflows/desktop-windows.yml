name: desktop-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  releases: write

jobs:
  windows:
    name: windows-x64
    runs-on: wine-node22
    env:
      HOME: /tmp
      PNPM_HOME: /tmp/pnpm
      WINEDEBUG: -all
      WINEPREFIX: /tmp/wine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage the API for Windows packaging
        shell: bash
        env:
          WELTBON_TAG_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "${WELTBON_TAG_VERSION}" ]; then
            export WELTBON_VERSION="${WELTBON_TAG_VERSION#v}"
          else
            base=$(node -p "require('./package.json').version")
            export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          export WELTBON_TARGET_PLATFORM=win32
          export WELTBON_TARGET_ARCH=x64
          cd desktop
          pnpm run build
          pnpm run stage
      - name: Build Windows desktop package
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop
          ./node_modules/.bin/electron-builder --win --x64 \
            --config electron-builder.yml --config.extraMetadata.version="$ver"
      - name: Publish Gitea release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset=$(find desktop/release -maxdepth 1 -type f -name '*.exe' -print -quit)
          test -n "$asset"
          api="${GITEA_SERVER_URL}/api/v1/repos/${GITEA_REPOSITORY}"
          response=$(curl --silent --show-error --write-out $'\n%{http_code}' \
            --header "Authorization: token ${GITEA_TOKEN}" \
            "${api}/releases/tags/${GITEA_REF_NAME}")
          status=${response##*$'\n'}
          release=${response%$'\n'*}
          if [ "$status" = 404 ]; then
            release=$(curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: token ${GITEA_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg tag "$GITEA_REF_NAME" --arg name "Weltbon $GITEA_REF_NAME" '{tag_name: $tag, name: $name, target_commitish: env.GITHUB_SHA, draft: false, prerelease: false}')" \
              "${api}/releases")
          elif [ "$status" != 200 ]; then
            printf 'could not look up release %s (HTTP %s)\n' "$GITEA_REF_NAME" "$status" >&2
            exit 1
          fi
          release_id=$(jq -er '.id' <<<"$release")
          asset_name=$(basename "$asset")
          old_asset=$(curl --fail --silent --show-error \
            --header "Authorization: token ${GITEA_TOKEN}" \
            "${api}/releases/${release_id}/assets" | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' | head -n 1)
          if [ -n "$old_asset" ]; then
            curl --fail --silent --show-error \
              --request DELETE \
              --header "Authorization: token ${GITEA_TOKEN}" \
              "${api}/releases/${release_id}/assets/${old_asset}"
          fi
          asset_name_uri=$(jq -rn --arg name "$asset_name" '$name | @uri')
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --form "attachment=@${asset}" \
            "${api}/releases/${release_id}/assets?name=${asset_name_uri}"
      - name: Upload Windows artifact
        # act_runner 0.6 uses the Gitea v1 artifact service; this fork keeps
        # the v4 protocol but accepts Gitea instead of rejecting it as GHES.
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: weltbon-windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
