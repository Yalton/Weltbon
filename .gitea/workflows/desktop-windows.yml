name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  releases: write

jobs:
  windows:
    name: windows-x64
    runs-on: wine-node22
    env:
      HOME: /tmp
      PNPM_HOME: /tmp/pnpm
      WINEDEBUG: -all
      WINEPREFIX: /tmp/wine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage the API for Windows packaging
        shell: bash
        env:
          WELTBON_TAG_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "${WELTBON_TAG_VERSION}" ]; then
            export WELTBON_VERSION="${WELTBON_TAG_VERSION#v}"
          else
            base=$(node -p "require('./package.json').version")
            export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          export WELTBON_TARGET_PLATFORM=win32
          export WELTBON_TARGET_ARCH=x64
          cd desktop
          pnpm run build
          pnpm run stage
      - name: Build Windows desktop package
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop
          ./node_modules/.bin/electron-builder --win --x64 \
            --config electron-builder.yml --config.extraMetadata.version="$ver"
      - name: Upload Windows artifact
        # act_runner 0.6 uses the Gitea v1 artifact service; this fork keeps
        # the v4 protocol but accepts Gitea instead of rejecting it as GHES.
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: weltbon-windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
  linux:
    name: linux-x64
    runs-on: ubuntu-latest
    env:
      HOME: /tmp
      PNPM_HOME: /tmp/pnpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage the API for Linux packaging
        shell: bash
        env:
          WELTBON_TAG_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "${WELTBON_TAG_VERSION}" ]; then
            export WELTBON_VERSION="${WELTBON_TAG_VERSION#v}"
          else
            base=$(node -p "require('./package.json').version")
            export WELTBON_VERSION="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          export WELTBON_COMMIT="$(git rev-parse --short HEAD)"
          export WELTBON_TARGET_PLATFORM=linux
          export WELTBON_TARGET_ARCH=x64
          cd desktop && pnpm run build && pnpm run stage
      - name: Build Linux desktop packages
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./desktop/.stage/api/version.json').version")
          cd desktop
          ./node_modules/.bin/electron-builder --linux --x64 \
            --config electron-builder.yml --config.extraMetadata.version="$ver"
      - name: Upload Linux artifact
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: weltbon-linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
  publish:
    name: publish-release
    needs: [windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HOME: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Download platform artifacts
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y --no-install-recommends unzip
          api="${GITEA_SERVER_URL}/api/v1/repos/${GITEA_REPOSITORY}"
          artifacts=$(curl --fail --silent --show-error --header "Authorization: token ${GITEA_TOKEN}" "${api}/actions/runs/${GITEA_RUN_ID}/artifacts")
          for name in weltbon-windows-x64 weltbon-linux-x64; do
            artifact_id=$(node -e 'const [json, name] = process.argv.slice(1); const artifact = JSON.parse(json).artifacts.find(item => item.name === name); if (!artifact) process.exit(1); process.stdout.write(String(artifact.id));' "$artifacts" "$name")
            # Gitea 1.25's archive_download_url is a web route which can return
            # HTML to Actions tokens. The API ZIP endpoint is authenticated and
            # always returns the archive bytes.
            url="${api}/actions/artifacts/${artifact_id}/zip"
            curl --fail --location --silent --show-error --header "Authorization: token ${GITEA_TOKEN}" --output "${name}.zip" "$url"
            unzip -q "${name}.zip" -d release-assets
          done
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
      - name: Publish complete Gitea release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_REF_NAME: ${{ github.ref_name }}
        run: scripts/publish-gitea-release-assets.sh release-assets/*
