# Two-instance rig for developing and manually verifying sync.
#
# Instance A runs on the HOST (vite 5173 + tsx watch API on 3000) against db-a,
# so the UI under development has HMR. Instance B is fully containerized on
# 3001. A reaches B at http://localhost:3001 — the A API is a host process, so
# no Docker networking is involved.
#
# Nothing here touches docker-compose.yml, which stays the production stack.
#
# No --env-file is needed to bring this up: every credential below is a fixed
# dev-only literal (never overridden by the project-root `.env`, since that
# file doesn't define JWT_SECRET_B/INVITE_CODE_B — verified with
# `docker compose -f docker-compose.dev.yml config`). Both published ports
# are bound to 127.0.0.1 only: nothing here needs LAN reachability, and these
# credentials are committed in plaintext.
name: weltbon-syncdev

services:
  # Postgres for instance A, published to the host so the host-run API can see it.
  db-a:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weltbon
      POSTGRES_USER: weltbon
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - pgdata-a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weltbon -d weltbon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Postgres for instance B. Internal only — nothing on the host talks to it.
  db-b:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weltbon
      POSTGRES_USER: weltbon
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata-b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weltbon -d weltbon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Instance B: the peer. A baked production build — a UI change needs
  # `up -d --build`, not a restart.
  #
  # JWT_SECRET/INVITE_CODE read *_B-suffixed variables and default to values
  # distinct from instance A's own. Override via a shell-exported JWT_SECRET_B /
  # INVITE_CODE_B if you need different values.
  app-b:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://weltbon:devpassword@db-b:5432/weltbon
      JWT_SECRET: ${JWT_SECRET_B:-peer-jwtsecret-peer-jwtsecret-32ch}
      INVITE_CODE: ${INVITE_CODE_B:-peer-invite-code}
      UPLOADS_DIR: /uploads
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - uploads-b:/uploads
    depends_on:
      db-b:
        condition: service_healthy

volumes:
  pgdata-a:
  pgdata-b:
  uploads-b:
