services:
  app:
    # To use a published image instead of building locally:
    #   1. Uncomment the `image:` line below
    #   2. Comment out (or delete) the `build: .` line
    # image: ghcr.io/<owner>/weltbon:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://weltbon:${POSTGRES_PASSWORD}@db:5432/weltbon
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weltbon
      POSTGRES_USER: weltbon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weltbon -d weltbon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
