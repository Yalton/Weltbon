services:
  app:
    # To use a published image instead of building locally:
    #   1. Uncomment the `image:` line below
    #   2. Comment out (or delete) the `build: .` line
    # image: ghcr.io/<owner>/weltbon:latest
    build:
      context: .
      # Build identity for GET /api/version.
      #
      # A self-hosted deploy compiles from a clone, so nothing inside the
      # container can derive these: the git history is not copied into the
      # runtime stage, and the Dockerfile's ARGs default to empty. Compose
      # cannot shell out either, so the values arrive through the environment —
      # scripts/deploy.sh computes and exports them.
      #
      # The `:-` defaults keep a bare `docker compose build` working rather than
      # erroring on an unset variable. The cost of building that way is an image
      # that reports the package.json version and a null commit, which is what
      # prod ran for a full release cycle before this existed.
      args:
        WELTBON_VERSION: ${WELTBON_VERSION:-}
        WELTBON_COMMIT: ${WELTBON_COMMIT:-}
        WELTBON_BUILT_AT: ${WELTBON_BUILT_AT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://weltbon:${POSTGRES_PASSWORD}@db:5432/weltbon
      UPLOADS_DIR: /uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weltbon
      POSTGRES_USER: weltbon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weltbon -d weltbon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  uploads:
